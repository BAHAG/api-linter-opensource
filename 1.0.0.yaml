                          type: string
                      postal_number:
                          type: string

        CustomerSearchResponseDto:
            type: object
            properties:
                amount:
                    type: integer
                    format: int64
                customers:
                    type: array
                    items:
                        allOf:
                            - $ref: '#/components/schemas/CustomerSearchRequestDto'
                            - type: object
                              required:
                                  - hybris_pk
                              properties:
                                  hybris_pk:
                                      type: string
                                      description: The identifier for customer data in Hybris
                                  customer_id:
                                      type: string
                                      description: The unique identifier in our CSS customer base (optional in this API version)
                                  country:
                                      type: string
                                      description: the billing address country
                                  is_account_approved:
                                      type: boolean
            example:
                amount: 2
                customers:
                    - hybris_pk: 12345
                      customer_id: 392e2366-463c-4f8a-a27a-1e00ba97f59f
                      debitor_number: 123
                      frist_name: John
                      last_name: Deere
                      company: Deere Corp.
                      street: Bakerstreet
                      house_number: 221b
                      postal_code: 12345
                      town: London
                      phone: (+44) 555 55555
                      email: john@deere.com
                    - hybris_pk: 54321
                      customer_id: 352f2566-123a-4f8a-a27a-1e00ba97f60d
                      debitor_number: 231
                      frist_name: Maria
                      last_name: Doe
                      street: Gutenbergstraße
                      house_number: 26
                      postal_code: 68199
                      town: Mannheim
                      phone: (+44) 555 666666
                      email: marie@doe.com

        CustomerSearchRequestDto:
            type: object
            example:
                last_name: Holmes
                street_name: Bakerstreet
            properties:
                debitor_number:
                    type: number
                first_name:
                    type: string
                    maxLength: 34
                last_name:
                    type: string
                    minLength: 2
                    maxLength: 35
                company:
                    type: string
                street_name:
                    type: string
                    minLength: 2
                house_number:
                    type: string
                    maxLength: 9
                postal_code:
                    type: string
                town:
                    type: string
                    minLength: 2
                    maxLength: 35
                phone:
                    type: string
                    nullable: true
                    pattern: '^[0+][0-9\s\-()./]+$'
                email:
                    type: string
                    description: this is the email-address of the customer
                    pattern: /^(?!.{56})(?![.-])([A-Za-z0-9_%+-]+\.)*[A-Za-z0-9_%+-]+(?<![.-])@(?![.-])([A-Za-z0-9-]+\.)+[A-Za-z]{2,}$/
                pluscard_number:
                    type: string
                tax_number:
                    type: string

        SocialAuthProviderUrlDto:
            type: object
            properties:
                apple:
                    type: string
                    format: uri
                google:
                    type: string
                    format: uri
                facebook:
                    type: string
                    format: uri
            example:
                apple: 'https://appleid.apple.com/auth/authorize?response_type=code%20id_token&client_id=info.bauhaus.capp.signin&redirect_uri=https%3A%2F%2Fbagag.dev%2Fauth%2Fsocial%2Fapple%2Fcallback&scope=name%20email%20openid&state=DE_a50791db-1383-4b72-914d-f6b768ada410_&response_mode=form_post'
                google: 'https://accounts.google.com/o/oauth2/auth?response_type=code&client_id=380622868501-k6hampdmcka6i8em891mud49js6sjchb.apps.googleusercontent.com&redirect_uri=https%3A%2F%2Fbagag.dev%2Fauth%2Fsocial%2Fgoogle%2Fcallback&scope=openid%20email%20profile&state=DE_889cc1fb-919a-4327-a2b5-05c0637b9621_'
                facebook: 'NOT_YET_IMPLEMENTED'

        NewsletterSubcriptionDto:
            type: object
            required:
                - email
                - device_id
                - newsletter_source
            properties:
                email:
                    type: string
                    description: this is the email-address of the customer
                    pattern: /^(?!.{56})(?![.-])([A-Za-z0-9_%+-]+\.)*[A-Za-z0-9_%+-]+(?<![.-])@(?![.-])([A-Za-z0-9-]+\.)+[A-Za-z]{2,}$/
                first_name:
                    type: string
                    maxLength: 34
                last_name:
                    type: string
                    minLength: 2
                    maxLength: 35
                guid:
                    type: string
                device_id:
                    type: string
                newsletter_source:
                    $ref: '#/components/schemas/NewsletterSource'
                store_of_interest:
                    description: |
                        This property is required if the given country_code equals CH
                    $ref: '#/components/schemas/StoreOfInterestCh'
                preferred_language:
                    description: |
                        This property is required if the given country_code equals CH
                    $ref: '#/components/schemas/CorrespondenceLanguage'
                newsletter_consent_type:
                    description: |
                        Sets the NEWSLETTER_TYPE that is beeing used for the future Subscription
                    $ref: '#/components/schemas/NewsletterType'

        NewsletterSource:
            type: string
            enum:
                - ACCOUNT
                - REGISTRATION
                - CHECKOUT
                - STANDALONE

        StoreOfInterestCh:
            type: string
            description: 'only considered for CH'
            enum:
                - KEINE_AUSWAHL
                - FACHCENTER_MATRAN
                - FACHCENTER_MELS
                - FACHCENTER_NIEDERWANGEN
                - FACHCENTER_OFTRINGEN
                - FACHCENTER_SCHLIEREN
            default: KEINE_AUSWAHL

        NewsletterUnsubcriptionDto:
            type: object
            required:
                - email
                - device_id
            properties:
                email:
                    type: string
                    description: this is the email-address of the customer
                    pattern: /^(?!.{56})(?![.-])([A-Za-z0-9_%+-]+\.)*[A-Za-z0-9_%+-]+(?<![.-])@(?![.-])([A-Za-z0-9-]+\.)+[A-Za-z]{2,}$/
                guid:
                    type: string
                device_id:
                    type: string

        ForgotPasswordDto:
            type: object
            required:
                - email
            properties:
                email:
                    type: string
                    description: this is the email-address of the customer
                    pattern: /^(?!.{56})(?![.-])([A-Za-z0-9_%+-]+\.)*[A-Za-z0-9_%+-]+(?<![.-])@(?![.-])([A-Za-z0-9-]+\.)+[A-Za-z]{2,}$/

        ResetPasswordDataDto:
            type: object
            required:
                - email
                - password_new
                - password_new_repeat
                - token
            properties:
                email:
                    type: string
                    description: this is the email-address of the customer
                    pattern: /^(?!.{56})(?![.-])([A-Za-z0-9_%+-]+\.)*[A-Za-z0-9_%+-]+(?<![.-])@(?![.-])([A-Za-z0-9-]+\.)+[A-Za-z]{2,}$/
                password_new:
                    maxLength: 100
                    minLength: 8
                    type: string
                    x-constraints: '@PasswordFormat'
                password_new_repeat:
                    maxLength: 100
                    minLength: 8
                    type: string
                    x-constraints: '@PasswordFormat'
                tos_accepted:
                    type: boolean
                token:
                    type: string

        ValidEmployeeCardResponseDto:
            type: object
            required:
                - valid
            properties:
                valid:
                    type: boolean
                    default: false
                employee_card_number:
                    type: string
                employee_number:
                    type: string
            example:
                valid: false
                employee_card_number: '7026787643023'
                employee_number: '123455667'

        ApproveNewsletterSubscriptionDto:
            type: object
            required:
                - email
                - token
            properties:
                email:
                    type: string
                    pattern: /^(?!.{56})(?![.-])([A-Za-z0-9_%+-]+\.)*[A-Za-z0-9_%+-]+(?<![.-])@(?![.-])([A-Za-z0-9-]+\.)+[A-Za-z]{2,}$/
                token:
                    type: string
                    maxLength: 34

    parameters:
        cssApiKey:
            in: header
            name: x-css-api-key
            description: An api key provided by the CSS team that allows fine grained access to data in customer-base
            example: 00000000-0000-0000-0000-000000000000
            required: true
            schema:
                type: string

        employeeKey:
            in: header
            name: x-css-employee-key
            description: An key provided by the employee that allows fine grained access to data in customer-base
            example: '878i254165'
            required: true
            schema:
                type: string

        countryCode:
            in: path
            name: country-code
            description: the country code of an store
            required: true
            example: de
            schema:
                type: string
                enum:
                    - de
                    - ch
                    - es
                    - at
                    - hu
                    - hr
                    - si
                    - nl
                    - lu

        customerId:
            in: path
            name: customer-id
            description: the customer-id will be the customer ID
            required: true
            example: '656i795647'
            schema:
                type: string

        customerIds:
            in: query
            name: customer_ids
            description: a comma separated list of customer ids (max 100)
            required: true
            schema:
                type: array
                items:
                    type: string
                maxItems: 100
            example: ['9568598720516', '9568856455617', '9568598720516']
            style: form
            explode: false

        addressId:
            in: path
            name: address-id
            description: the address-id will be the address ID
            required: true
            example: '656i795647'
            schema:
                type: string

        email:
            name: email
            in: query
            description: the email to verify
            required: true
            example: test@bahag.com
            schema:
                type: string

        employeeCardNumber:
            name: employee_card_number
            in: query
            description: the employeecard number to be verified
            required: true
            schema:
                type: string

    responses:
        CustomerResponse:
            description: respone containing a single customers information
            content:
                application/json:
                    schema:
                        $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/schemas/Customer'
        ExtendedCustomerResponse:
            description: respone containing a single customers information
            content:
                application/json:
                    schema:
                        type: array
                        items:
                            $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/schemas/ExtendedCustomer'
        ValidEmployeeCardResponse:
            description: respone the validation status of an employee_card
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ValidEmployeeCardResponseDto'
        CustomerSearchResponse:
            description: respone containing search results
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/CustomerSearchResponseDto'
        MessageResponse:
            description: respone containing a message
            content:
                application/json:
                    schema:
                        $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/schemas/Message'

        PartialCustomerResponse:
            description: PARTIAL CONTENT - Response when a login was successful but the customer is not fully registered or logged in yet
            content:
                application/json:
                    schema:
                        $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/schemas/PartialCustomer'
        AccountStatusResponse:
            description: Returns account status for provided email
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            status:
                                type: string
                                enum:
                                    - ACCOUNT_EXISTS_FOR_OTHER_COUNTRIES
                                    - ACCOUNT_EXISTS_FOR_COUNTRY
                                    - EMAIL_NOT_IN_USE
                            active_in_countries:
                                type: array
                                items:
                                    type: string
                                example: ['DE', 'AT', 'HU']
        ActivePluscardCustomerResponse:
            description: Returns all new Registrations or Deletions from the day before
            content:
                application/json:
                    schema:
                        type: array
                        items:
                            type: object
                            properties:
                                pluscard_card_number:
                                    type: string
                                register_date:
                                    type: string
                                    format: date-time
                                deletion_date:
                                    type: string
                                    format: date-time
        EmailVerificationResponse:
            description: Response indicating whether an email is exist and return the customer type
            content:
                application/json:
                    schema:
                        type: object
                        required:
                            - customer_type
                            - customer_already_exists
                        properties:
                            customer_type:
                                $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/schemas/CustomerType'
                            customer_already_exists:
                                type: boolean
                            is_login_active:
                                type: boolean
                                nullable: true
                                description: null no customer in requested country was found,
                                    false for pending DOI / Approval Process,
                                    true for registered and active customers
                            social_login_type:
                                $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/schemas/SocialLoginType'

        ValidateTaxNumberResponse:
            description: Response providing data from tax office for a given tax number
            content:
                application/json:
                    schema:
                        type: object
                        required:
                            - is_valid
                        properties:
                            tax_number:
                                type: string
                                description: The validated tax number
                                example: '12345678'
                            group_tax_number:
                                type: string
                                description: Group tax number that might be associated with the tax number
                                example: '45678900'
                            is_valid:
                                type: boolean
                                description: Whether the tax number was validated sucessfully
                                example: true
                            error_message:
                                type: string
                                description: Error message from tax office in case when the tax number is not valid
                                example: NOT_REGISTERED_CUSTOMER
                            company_name:
                                type: string
                                description: Company name provided by tax office
                                example: BAUHAUS SZAKÁRUHÁZAK BT.
                            address:
                                description: Main addresses associated with the tax number
                                type: object
                                properties:
