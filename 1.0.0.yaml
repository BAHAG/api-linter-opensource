components:
  parameters:
    Country:
      required: true
      name: country
      in: path
      example: de
      schema:
        type: string
        enum:
          - de
          - at
          - es
          - ch
          - nl
          - hu
          - si
          - hr
          - lu
    Country_Q:
      name: country
      in: query
      required: false
      example: de
      schema:
        type: string
        enum:
          - de
          - at
          - es
          - ch
          - nl
          - hu
          - si
          - hr
          - lu
    EmployeeCardNumber_P:
      in: path
      name: employee_card_number
      required: true
      example: 1234567890
      schema:
        type: string
    Search:
      required: true
      name: search
      in: query
      example: Bormaschi
      schema:
        type: string
    Ean:
      required: true
      name: ean
      in: path
      example: 1234567890123
      schema:
        type: string
    Id:
      required: true
      name: id
      in: path
      example: 12345678
      schema:
        type: string
    CustomerId_Q:
      required: true
      name: customer_id
      in: query
      example: 12345678
      schema:
        type: string
    CustomerId_P:
      required: true
      name: customer_id
      in: path
      example: 12345678
      schema:
        type: string
    CartId:
      required: true
      name: cart_id
      in: path
      example: 12345678
      schema:
        type: string
    EntryId:
      required: true
      name: entry_id
      in: path
      example: 123456789
      schema:
        type: string
    Quantity:
      required: false
      name: quantity
      in: query
      example: 2
      schema:
        type: number
    PaymentProvider_Q:
      in: query
      name: payment_provider
      description: payment provider name
      required: true
      example: paylink
      schema:
        $ref: '#/components/schemas/PaymentProvider'
    OfferId_P:
      required: true
      name: offer_id
      in: path
      example: 12345678
      schema:
        type: string
    OfferId_Q:
      required: false
      name: offer_id
      in: query
      example: 12345678
      schema:
        type: string
    ReferenceNumber_P:
      required: true
      name: reference_number
      in: path
      example: 123456780
      schema:
        type: string
    AddressType_Q:
      in: query
      name: address_type
      description: type of address
      example: SHIPPING
      schema:
        type: string
        enum:
          - BILLING
          - SHIPPING
    Email:
      in: query
      name: email
      description: email of the customer
      required: false
      example: max.mustermann@muster.de
      schema:
        type: string
        format: email
    Email_P:
      in: path
      name: email
      description: email of the customer
      required: true
      example: max.mustermann@muster.de
      schema:
        type: string
        format: email
    Email_Q:
      in: query
      name: email
      description: email of the customer
      required: true
