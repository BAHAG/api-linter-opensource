          type: string

    ShippingCosts:
      type: array
      items:
        $ref: '#/components/schemas/ShippingCost'

    ShippingCostRequestBody:
      type: object
      required:
        - products
        - postal_code
      properties:
        products:
          type: array
          items:
            type: object
            required:
              - price
              - product_id
              - seller_id
              - quantity
            properties:
              price:
                type: number
                format: float
                example: 10
              product_id:
                type: string
                example: 20828538
              quantity:
                type: integer
                format: int32
                example: 3
              seller_id:
                type: string
                example: BAUHAUSDE
        postal_code:
          type: string
          example: 68167

    PaymentOptionsRequestBody:
      type: object
      description: Request body for fetching payment options.
      properties:
        cart_id:
          type: string
          description: Unique identifier of the shopping cart.
          example: c86edf51-1bed-4310-b906-12fad84ab79d
        cart_type:
          type: string
          description: Type of the cart.
          enum:
            - ONLINE
            - RESERVATION
            - MIXED_CART
          example: RESERVATION
        store_id:
          type: string
          example: 531
        customer_classification:
          type: string
          enum:
            - PRIVATE
            - COMPANY
          example: PRIVATE
        customer_type:
          type: string
          enum:
            - GUEST
            - INTERESTED
            - FIRST_BUYER
            - REGISTERED
            - NORMAL
            - EMPLOYEE
            - PLUSCARD
            - SERVICE
            - COMPANY
          example: PLUSCARD
        customer_id:
          type: string
          description: Unique identifier of the customer.
          example: 12323987654
        total_price:
          type: number
          format: float
          minimum: 1
          description: Total cart amount
          example: 129.99
        delivery_cost:
          type: number
          format: float
          example: 4.99
        products:
          type: array
          items:
            $ref: "#/components/schemas/PaymentOptionsProduct"
          minItems: 1
      required:
        - cart_id
        - cart_type
        - store_id
        - customer_type
        - total_price
        - delivery_cost
        - products

    PaymentOptionsProduct:
      type: object
      properties:
        product_id:
          type: string
          description: Unique product identifier.
          example: 100001
        total_price:
          type: number
          format: float
          description: Full price of the product
          example: 99.99
        handling_code:
          $ref: '#/components/schemas/HandlingCode'
        seller_id:
          type: string
          description: Identifier of the seller / marketplace merchant.
          example: BAUHAUSDE
      required:
        - product_id
        - total_price
        - handling_code
        - seller_id

    PaymentOptions:
      type: object
      properties:
        payment_methods:
          type: array
