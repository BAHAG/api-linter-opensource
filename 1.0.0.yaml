                          minLength: 2
                          maxLength: 50
                          description: Only relevant for HU
                      building:
                          type: string
                          maxLength: 32
                          description: Only relevant for HU
                      staircase:
                          type: string
                          maxLength: 32
                          description: Only relevant for HU
                      floor:
                          type: string
                          maxLength: 32
                          description: Only relevant for HU
                      door:
                          type: string
                          maxLength: 32
                          description: Only relevant for HU

        ShippingAddressDto:
            allOf:
                - $ref: '#/components/schemas/BaseAddressDto'
                - type: object
                  required:
                      - house_number
                  properties:
                      house_number:
                          type: string
                          maxLength: 9
                      company_name:
                          type: string
                          maxLength: 50
                      district:
                          type: string
                          pattern: '^\\d+$'
                          minLength: 1
                          maxLength: 2
                          description: Only relevant for HU
                      type_of_public_space:
                          type: string
                          minLength: 2
                          maxLength: 50
                          description: Only relevant for HU
                      building:
                          type: string
                          maxLength: 32
                          description: Only relevant for HU
                      staircase:
                          type: string
                          maxLength: 32
                          description: Only relevant for HU
                      floor:
                          type: string
                          maxLength: 32
                          description: Only relevant for HU
                      door:
                          type: string
                          maxLength: 32
                          description: Only relevant for HU

        StoreAddressDto:
            allOf:
                - $ref: '#/components/schemas/BaseAddressDto'
                - type: object
                  required:
                      - pos_id
