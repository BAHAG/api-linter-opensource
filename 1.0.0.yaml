openapi: 3.0.0
info:
    title: Central Customer Base API
    description: API to manage customers
    contact:
        name: Central Customer Base API
        url: https://app.swaggerhub.com/apis/BAHAG/api-customer-base/1.0.22
        email: customerselfservice@bahag.com
    version: 1.0.22
    x-published: true
    x-default: true
    x-api-id: 3af0533f-a418-475d-9869-61d3ab08667a
    x-audience: company-internal
    x-channel: https://teams.microsoft.com/l/channel/19%3a0abdb90741b040e295cafb5a10d82619%40thread.tacv2/CSS-api-customer-base?groupId=a5a9b025-0708-4a70-a62b-b17b044eff82&tenantId=e11e0ba0-85ac-4e5e-bfc4-4f119901dbed
    x-monitoring: https://app.datadoghq.eu/dashboard/cqx-ne6-hv3/css-customer-base?refresh_mode=sliding&tpl_var_env%5B0%5D=prod&tpl_var_service_name%5B0%5D=css-ccb-service-prod&view=spans&from_ts=1703756725512&to_ts=1703760325512&live=true
    x-alerting: https://teams.microsoft.com/l/channel/19%3a0abdb90741b040e295cafb5a10d82619%40thread.tacv2/CSS-api-customer-base?groupId=a5a9b025-0708-4a70-a62b-b17b044eff82&tenantId=e11e0ba0-85ac-4e5e-bfc4-4f119901dbed
    x-apigee-proxy: customer-base-v1
    x-business-critical: true
    x-authentication-method: 'apikey,oauth2'
    x-data-types: 'customer'
    x-gdpr: true
    x-touchpoints-types: 'consumerapp,onlineshop,salesapp'
    x-restrictions: false

# servers
servers:
    # Added by API Auto Mocking Plugin
    - description: SwaggerHub API Auto Mocking
      url: https://virtserver.swaggerhub.com/BAHAG/api-customer-base/1.0.22
    - description: DEV
      url: https://dev.api.bauhaus/v1/customer-base/1
    - description: QS
      url: https://qs.api.bauhaus/v1/customer-base/1
    - description: PROD
      url: https://api.bauhaus/v1/customer-base/1

# tags
tags:
    - name: Health
      description: |
          Metadata about the API
    - name: Registration
      description: |
          Registers a new customer
    - name: Newsletter
      description: |
          Subscribe / Unsubscribe to Newsletter
    - name: Authentication
      description: |
          Login / Logout / Reset-Password
    - name: Customer
      description: |
          Read / Update / Delete a customer.
          Needs customer authentication
    - name: Guest - Address
      description: |
          Create / Read / Update - Address
          Needs NO customer authentication
    - name: Services
      description: |
          Search / verify Email
    - name: Backoffice-Operations [internal]
      description: |
          Provides:
          Update a Customer,
          Create / Update / Delete Address
    - name: Service-to-Service [internal]
      description: |
          For Service to Service communication.
          Provides:
          GetActivePluscardCustomers
    - name: Social-Authentication
      description: |
          Provides provider data with auth-urls
    - name: Pluscard-Request-Form
      description: |
          Request a new Pluscard

# path definitions
paths:
    /health:
        get:
            tags:
                - Health
            summary: |
                Health endpoint can be called to check the availability of the Service.
                It returns some basic information about the API.
            operationId: getHealth
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/schemas/Health'
                '500':
                    description: KO

    /{country-code}/authentication/forgot-password:
        post:
            tags:
                - Authentication
            summary: |
                Request a password reset link by email.
            operationId: forgottenPassword
            parameters:
                - $ref: '#/components/parameters/countryCode'
            requestBody:
                description: |
                    Email Dto for providing the Password reset link that links to PWA Password reset page.
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ForgotPasswordDto'
            responses:
                '200':
                    $ref: '#/components/responses/MessageResponse'
                '400':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/BadRequest'
                '401':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/Unauthorized'
                '404':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/NotFound'
                '504':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/TimeOut'

    /{country-code}/authentication/reset-password:
        post:
            tags:
                - Authentication
            summary: |
                Reset Password using Email Token from the Password reset link.
            deprecated: true
            operationId: resetPassword
            parameters:
                - $ref: '#/components/parameters/countryCode'
            requestBody:
                description: |
                    Provides Password and Email Token for changing the password.
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ResetPasswordDataDto'
            responses:
                '200':
                    $ref: '#/components/responses/MessageResponse'
                '400':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/BadRequest'
                '401':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/Unauthorized'
                '404':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/NotFound'
                '504':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/TimeOut'

    /{country-code}/customers/register/approve:
        post:
            tags:
                - Registration
            summary: |
                Check if an account with the given email exists in the given country, if not create a new Customer.
            operationId: approveRegistration
            parameters:
                - $ref: '#/components/parameters/countryCode'
                - $ref: '#/components/parameters/cssApiKey'
            requestBody:
                description: |
                    The approval-data of a customer registration
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ApprovalCustomerDto'
            responses:
                '200':
                    $ref: '#/components/responses/CustomerResponse'
                '400':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/BadRequest'
                '401':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/Unauthorized'
                '409':
                    description: CONFLICT if the email has already an account
                    content:
                        application/json:
                            schema:
                                $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/schemas/ErrorModel'
                '404':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/NotFound'
                '504':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/TimeOut'

    /{country-code}/customers/register/resend-mail:
        post:
            tags:
                - Registration
            summary: |
                Resends the pluscard approval email incase of invalid token.
            operationId: resendApprovalMail
            parameters:
                - $ref: '#/components/parameters/countryCode'
            requestBody:
                description: |
                    The data for resending approval email.
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ResendCustomerDto'
            responses:
                '200':
                    description: OK
                '400':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/BadRequest'
                '401':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/Unauthorized'
                '404':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/NotFound'
                '504':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/TimeOut'

    /{country-code}/customers/newsletter/subscribe:
        post:
            tags:
                - Newsletter
            summary: |
                Subscribe to Newsletter.
            operationId: subscribeNewsletter
            parameters:
                - $ref: '#/components/parameters/countryCode'
                - $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/parameters/hybrisAuthNonRequiry'
            requestBody:
                description: |
                    The customer-data for Newsletter subscription
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/NewsletterSubcriptionDto'
            responses:
                '200':
                    description: OK
                '400':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/BadRequest'
                '401':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/Unauthorized'
                '404':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/NotFound'
                '504':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/TimeOut'

    /{country-code}/customers/newsletter/subscribe/approve:
        parameters:
            - $ref: '#/components/parameters/countryCode'
        post:
            tags:
                - Newsletter
            operationId: approveNewsletterSubscription
            summary: |
                subscribe the customer to the newsletter
            requestBody:
                description: |
                    An initial customer
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ApproveNewsletterSubscriptionDto'
            responses:
                '200':
                    description: 'OK'
                '401':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/Unauthorized'
                '404':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/NotFound'
                '504':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/TimeOut'

    /{country-code}/customers/newsletter/unsubscribe:
        post:
            tags:
                - Newsletter
            summary: |
                Unsubscribe from Newsletter.
            operationId: unsubscribeNewsletter
            parameters:
                - $ref: '#/components/parameters/countryCode'
                - $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/parameters/hybrisAuth'
            requestBody:
                description: |
                    The customer-data for Newsletter unsubscription
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/NewsletterUnsubcriptionDto'
            responses:
                '200':
                    description: OK
                '400':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/BadRequest'
                '401':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/Unauthorized'
                '404':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/NotFound'
                '504':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/TimeOut'

    /{country-code}/customers:
        parameters:
            - $ref: '#/components/parameters/countryCode'
            - $ref: '#/components/parameters/customerIds'
            - $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/parameters/consentFilter'
            - $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/parameters/addressFilter'
        get:
            tags:
                - Customer
            summary: |
                Get extended customer information including consent data based on filter
            operationId: getCustomersExtended
            responses:
                '200':
                    $ref: '#/components/responses/ExtendedCustomerResponse'
                '401':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/Unauthorized'
                '404':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/NotFound'
                '504':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/TimeOut'

    /{country-code}/customers/{customer-id}:
        get:
            tags:
                - Customer
            summary: |
                Get customer information
            operationId: getCustomer
            parameters:
                - $ref: '#/components/parameters/countryCode'
                - $ref: '#/components/parameters/customerId'
                - $ref: '#/components/parameters/cssApiKey'
                - $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/parameters/hybrisAuthNonRequiry'
            responses:
                '200':
                    $ref: '#/components/responses/CustomerResponse'
                '206':
                    $ref: '#/components/responses/PartialCustomerResponse'
                '400':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/BadRequest'
                '401':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/Unauthorized'
                '404':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/NotFound'
                '504':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/TimeOut'

        put:
            tags:
                - Customer
            operationId: updateCustomer
            summary: |
                updates the data of a customer
            deprecated: true
            requestBody:
                description: |
                    user data
                required: true
                content:
                    application/json:
                        schema:
                            $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/schemas/User'
            parameters:
                - $ref: '#/components/parameters/countryCode'
                - $ref: '#/components/parameters/customerId'
                - $ref: '#/components/parameters/cssApiKey'
                - $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/parameters/hybrisAuth'
            responses:
                '200':
                    $ref: '#/components/responses/CustomerResponse'
                '401':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/Unauthorized'
                '404':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/NotFound'
                '504':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/TimeOut'

        delete:
            tags:
                - Customer
            summary: |
                Delete customer
            deprecated: true
            operationId: deleteCustomer
            parameters:
                - $ref: '#/components/parameters/countryCode'
                - $ref: '#/components/parameters/customerId'
                - $ref: '#/components/parameters/cssApiKey'
                - $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/parameters/hybrisAuth'
            responses:
                '200':
                    $ref: '#/components/responses/MessageResponse'
                '400':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/BadRequest'
                '401':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/Unauthorized'
                '404':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/NotFound'
                '504':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/TimeOut'

    /{country-code}/guest/{customer-id}/address:
        parameters:
            - $ref: '#/components/parameters/countryCode'
            - $ref: '#/components/parameters/cssApiKey'
            - $ref: '#/components/parameters/customerId'
        post:
            tags:
                - Guest - Address
            deprecated: true
            summary: |
                Create an address for guest customer
                [deprecated] Use @POST('customer-masterdata/:countryCode/customers/address')

            operationId: createGuestAddress
            requestBody:
                description: Guest-customer address
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DefaultAddressDto'
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/schemas/Address'
                '401':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/Unauthorized'
                '404':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/NotFound'
                '504':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/TimeOut'

    /{country-code}/guest/{customer-id}/address/{address-id}:
        parameters:
            - $ref: '#/components/parameters/countryCode'
            - $ref: '#/components/parameters/cssApiKey'
            - $ref: '#/components/parameters/customerId'
            - $ref: '#/components/parameters/addressId'
        get:
            tags:
                - Guest - Address
            deprecated: true
            summary: |
                Get an address for guest customer
                [deprecated] Use @GET('customer-masterdata/:countryCode/customers/address')
            operationId: getGuestAddress
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/schemas/Address'
                '401':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/Unauthorized'
                '404':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/NotFound'
                '504':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/TimeOut'
        put:
            tags:
                - Guest - Address
            summary: |
                Update an address for guest customer
            operationId: updateGuestAddress
            requestBody:
                description: Guest-customer address
                    [deprecated] Use @PUT('customer-masterdata/:countryCode/customers/address')
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DefaultAddressDto'
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/schemas/Address'
                '401':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/Unauthorized'
                '404':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/NotFound'
                '504':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/TimeOut'

    /{country-code}/customers/search:
        parameters:
            - $ref: '#/components/parameters/countryCode'
            - $ref: '#/components/parameters/cssApiKey'
        post:
            tags:
                - Services
            summary: |
                Get customer information by search criteria
            operationId: searchCustomer
            requestBody:
                description: Search query
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CustomerSearchRequestDto'
            responses:
                '200':
                    $ref: '#/components/responses/CustomerSearchResponse'
                '400':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/BadRequest'
                '401':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/Unauthorized'
                '404':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/NotFound'
                '504':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/TimeOut'

    /{country-code}/customers/verify/email:
        parameters:
            - $ref: '#/components/parameters/countryCode'
            - $ref: '#/components/parameters/cssApiKey'
        post:
            tags:
                - Services
            summary: |
                Verify if an email is already in use and return customer_type if exists
            operationId: verifyUserEmail
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                email:
                                    type: string
                                    description: the email to verify
                                    example: john.doe@bahag.com
            responses:
                '200':
                    $ref: '#/components/responses/EmailVerificationResponse'
                '400':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/BadRequest'
                '401':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/Unauthorized'
                '404':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/NotFound'
                '504':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/TimeOut'

    /{country-code}/customers/validate/employee-card:
        parameters:
            - $ref: '#/components/parameters/countryCode'
            - $ref: '#/components/parameters/cssApiKey'
            - $ref: '#/components/parameters/employeeCardNumber'
        get:
            tags:
                - Services
            summary: |
                Validates if given employeecard number is valid or not
            operationId: validateEmployeeCard
            responses:
                '200':
                    $ref: '#/components/responses/ValidEmployeeCardResponse'
                '400':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/BadRequest'
                '401':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/Unauthorized'
                '403':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/Forbidden'
                '404':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/NotFound'
                '504':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/TimeOut'

    /{country-code}/customers/validate/tax-number:
        parameters:
            - in: path
              name: country-code
              description: the country code (currently only HU is supported)
              required: true
              example: hu
              schema:
                  type: string
                  enum:
                      - hu
        post:
            tags:
                - Services
            summary: |
                Validate a provided tax number against tax office authorities
            operationId: validateTaxNumber
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                tax_number:
                                    type: string
                                    example: 22516716-2-44
            responses:
                '200':
                    $ref: '#/components/responses/ValidateTaxNumberResponse'
                '400':
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/responses/BadRequest'
                '401':
