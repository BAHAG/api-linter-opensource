          items:
            type: object
            properties:
              id:
                type: string
                enum:
                  - CASHIER_DESK
                  - CASH_ON_DELIVERY
                  - PREPAYMENT
                  - PLUSCARD
                  - PAYLINK
                  - INVOICE
                example: CASH_ON_DELIVERY
              available:
