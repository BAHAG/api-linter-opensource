name: CI for docker images

on:
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BIGQUERY_API_SERVICE_ACCOUNT_JSON: ${{ secrets.BIGQUERY_API_SERVICE_ACCOUNT_JSON }}
  GCP_DEPLOY_SA: ${{ secrets.GCP_DEPLOY_SA }}
  SWAGGERHUB_API_KEY: ${{ secrets.SWAGGER_HUB_KEY }}
  TF_VAR_project: ${{ secrets.BIGQUERY_API_PROJECT_ID }}

jobs:
  local-dev-test-linter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            linter:
              - 'local_dev/**'
              - 'package/**'
              - 'requirements.txt'
              - 'tests/**'
              - 'rules.json'
              - 'Dockerfile'

      - name: Enable the universe repository
        run: |
            sudo add-apt-repository universe

      - name: Install required dependencies
        run: | 
              sudo apt-get update -y
              sudo apt-get install -y build-essential python3-dev wget

      - name: Install yq
        if: steps.changes.outputs.linter == 'true'
        run: |
          VERSION=v4.34.1
          BINARY=yq_linux_amd64
          wget https://github.com/mikefarah/yq/releases/download/${VERSION}/${BINARY}.tar.gz -O - | tar xz && sudo mv ${BINARY} /usr/bin/yq

      - name: Install pip3
        run: sudo apt-get install python3-pip -y --fix-missing

      - name: install setuptools
        run: pip3 install wheel setuptools cython

      - name: install packages
        run: pip3 install -r requirements.txt

      - name: Test the linter with sample yaml files in the tests/ directory
        if: steps.changes.outputs.linter == 'true'
        run: ./test_linter.sh

      - name: Test linter with real specification files to catch bugs
        if: steps.changes.outputs.linter == 'true' && success()
        run: python3 test-yaml-loading.py

      - name: Login to google cloud console
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Create binary for mac os
        run: pyinstaller local_dev/linter.py
      
      - name: Compress dist folder
        run: tar -czvf mac_dist.tar.gz dist rules.json

      - name: Install required node modules and pack the vscode extension
        run: |-
          rm api-linter-extension/data/rules.json && cp rules.json api-linter-extension/data/rules.json
          cd api-linter-extension
          npm install
          npm install -g @vscode/vsce
          vsce pack --skip-license --out ../api_linter_extension.vsix
          cd ..

      - name: Create prod.conf
        working-directory: terraform
        run: |
          echo "bucket = \"${{ secrets.BIGQUERY_API_PROJECT_ID }}-tfstate\"" > prod.conf
          echo "prefix = \"linter-vs-code-extension-prod-state\"" >> prod.conf
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1

      - name: Terraform init
        run: terraform -chdir=terraform init --backend-config=prod.conf
      
      - name: Terraform fmt
        run: terraform -chdir=terraform fmt -check
      
      - name: Terraform plan
        id: plan
        run: terraform -chdir=terraform plan -var-file="prod.tfvars" -no-color 2>&1 | tee /tmp/tfplan.txt
        continue-on-error: true

      - name: Comment PR with Terraform plan
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('/tmp/tfplan.txt', 'utf8');
            const maxLen = 65000;
            const truncated = plan.length > maxLen
              ? plan.slice(0, maxLen) + '\n\n... output truncated ...'
              : plan;
            const body = `## Terraform Plan\n\`\`\`terraform\n${truncated}\n\`\`\``;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('## Terraform Plan'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if Terraform plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
