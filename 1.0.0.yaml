                example: 2022-07-15T02:00:00+02:00
              valid_till:
                type: string
                format: date-time
                nullable: false
                example: 2023-07-15T02:00:00+02:00
              price_type:
                type: string
                enum:
                  - REGULAR
                  - MARKETING
                example: REGULAR
              additional_price_information:
                type: array
                items:
                  type: object
                  required:
                    - quantity
                    - price
                    - unit
                    - price_type
                  properties:
                    quantity:
                      type: integer
                      format: int32
                      example: 4
                    price:
                      $ref: '#/components/schemas/Price'
                    unit:
                      type: string
                      example: Stück
                    base_quantity:
                      type: integer
                      format: int32
                      example: 1
                    base_price:
                      $ref: '#/components/schemas/Price'
                    base_unit:
                      type: string
                      example: Stück
                    valid_from:
                      type: string
                      format: date-time
                      nullable: false
                      example: 2022-07-15T02:00:00+02:00
                    valid_till:
                      type: string
                      format: date-time
                      nullable: false
                      example: 2023-07-15T02:00:00+02:00
                    price_type:
                      type: string
                      enum:
                        - STRIKE_PRICE
