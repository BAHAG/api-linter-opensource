        - attributes
    ProductSearchResult:
      type: object
      required:
        - total
        - products
        - filters
        - quick_filters
        - sorts
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductCard'
        total:
          type: integer
          format: int32
        filters:
          type: array
          items:
            $ref: '#/components/schemas/ProductSearchFilterFacet'
        quick_filters:
          type: array
          items:
            $ref: '#/components/schemas/ProductSearchFilterFacet'
        quick_category:
          $ref: '#/components/schemas/ProductSearchQuickCategoryFacet'
        sorts:
          type: array
          items:
            type: object
            required:
              - id
              - name
            properties:
              id:
                type: string
              name:
                type: string
              selected:
                type: boolean
    ProductSearchFilterFacet:
      type: object
      required:
        - name
        - id
        - type
      oneOf:
        - $ref: "#/components/schemas/ProductSearchFilterSingleFacet"
        - $ref: "#/components/schemas/ProductSearchFilterMultiFacet"
        - $ref: "#/components/schemas/ProductSearchFilterRangeFacet"
        - $ref: "#/components/schemas/ProductSearchFilterCategoryFacet"
      discriminator:
        propertyName: type
        mapping:
          SINGLE: "#/components/schemas/ProductSearchFilterSingleFacet"
          MULTI: "#/components/schemas/ProductSearchFilterMultiFacet"
          RANGE: "#/components/schemas/ProductSearchFilterRangeFacet"
          CATEGORY: "#/components/schemas/ProductSearchFilterCategoryFacet"
      properties:
        name:
          type: string
          description: Name of the facet. Used for display.
        id:
          type: string
          description: The id of the facet. Used for the query parameter.
        type:
          type: string
    ProductSearchFilterSingleFacet:
      type: object
      required:
        - name
        - id
        - options
        - type
      description: Filtering by a list of options, with the option to choose only one value.
      properties:
        name:
          type: string
          description: Name of the facet. Used for display.
        id:
          type: string
          description: The id of the facet. Used for the query parameter.
        popularity_score:
          type: number
          format: double
        approximate_entropy:
          type: number
          format: double
        real_entropy:
          type: number
          format: double
        options:
          type: array
          items:
            $ref: "#/components/schemas/ProductSearchFilterFacetOption"
          description: List of facet options.
        type:
          type: string
    ProductSearchFilterMultiFacet:
      type: object
      required:
        - name
        - id
        - options
        - type
      description: Filtering by a list of options, with the option to choose more than one value.
      properties:
        name:
          type: string
          description: Name of the facet. Used for display.
        id:
          type: string
          description: The id of the facet. Used for the query parameter.
        popularity_score:
          type: number
          format: double
        approximate_entropy:
          type: number
          format: double
        real_entropy:
          type: number
          format: double
        options:
          type: array
          items:
            $ref: "#/components/schemas/ProductSearchFilterFacetOption"
          description: List of facet options.
        type:
          type: string
    ProductSearchFilterRangeFacet:
      type: object
      required:
        - name
        - id
        - properties
        - type
      description: Filtering by range on numerical fields.
      properties:
        popularity_score:
          type: number
          format: double
        name:
          type: string
        id:
          type: string
        selected_values:
          $ref: "#/components/schemas/ProductSearchFilterSelectedValues"
        properties:
          $ref: "#/components/schemas/ProductSearchFilterRange"
        popular_options:
          type: array
          items:
            $ref: "#/components/schemas/ProductSearchFilterPopularValues"
          description: List of popular facet options.
        type:
          type: string
    ProductSearchFilterCategoryFacet:
      type: object
      required:
        - name
        - id
        - options
        - type
      description:
        Special type for category filter. Similar to SINGLE.
        Option values are category ids.
        Facet options are the selected category and its children.
        Only one facet option is selectable.
      properties:
        name:
          type: string
          description: Name of the facet. Used for display.
        id:
          type: string
          description: The id of the facet. Used for the query parameter.
        popularity_score:
          type: number
          format: double
        approximate_entropy:
          type: number
          format: double
        real_entropy:
          type: number
          format: double
        options:
          type: array
          items:
            $ref: "#/components/schemas/ProductSearchFilterFacetOption"
          description: List of facet options.
        type:
          type: string
    ProductSearchQuickCategoryFacet:
      type: object
      required:
        - id
        - options
      properties:
        id:
          type: string
          description: The id of the facet. Used for the query parameter.
        options:
          type: array
          items:
            $ref: "#/components/schemas/ProductSearchQuickCategoryFacetOption"
          description: List of facet options.
    ProductSearchQuickCategoryFacetOption:
      type: object
      required:
        - value
        - name
      properties:
        value:
          type: string
          description: Id of the facet option. Use this while calling the api.
        name:
          type: string
    ProductSearchFilterFacetOption:
      type: object
      required:
        - value
        - name
        - count
      properties:
        value:
          type: string
          description: Id of the facet option. Use this while calling the api.
        name:
          type: string
          description: The string to display.
        url_friendly_name:
          type: string
          description: Used for generating the indexed urls.
        asset_id:
          type: string
        count:
          type: integer
          format: int64
        selected:
          type: boolean
          description: Whether the option is selected.
    ProductSearchFilterSelectedValues:
      type: object
      properties:
        min:
          type: number
          format: double
        max:
          type: number
          format: double
    ProductSearchFilterRange:
      type: object
      properties:
        min:
          type: number
          format: double
        max:
          type: number
          format: double
        step:
          type: number
          format: double
        unit:
          type: string
    ProductSearchFilterPopularValues:
      type: object
      properties:
        min:
          type: number
          format: double
        max:
          type: number
          format: double
    ShippingCostResponse:
      type: object
      required:
        - data
