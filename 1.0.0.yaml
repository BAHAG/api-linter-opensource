          required:
            - first_name
            - last_name
            - country
    PurchaseOrderBody:
      type: object
      required:
        - payment_provider
        - products
        - total_price
        - sub_total
        - shipping_costs
        - tax
        - invoice_address
        - delivery_address
        - cart_id
        - currency
        - order_type
        - timezone
      properties:
        customer_id:
          type: string
          example: 123456789
        debitor_number:
          type: integer
          format: int64
          example: 123232222
        payment_provider:
          $ref: '#/components/schemas/PaymentProvider'
        products:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrderProduct'
        total_price:
          type: number
          format: float
          example: 19.99
        sub_total:
          type: number
          format: float
          example: 9.99
        shipping_costs:
          type: number
          format: float
          example: 4.99
        tax:
          type: number
          format: float
          example: 5.00
        timezone:
          type: string
          description: Timezone of the user placing the order
          example: Europe/Berlin
        contact_phone:
          type: string
          example: 123456789
        self_service_ban:
          type: boolean
          example: false
        contact_email:
          type: string
          example: Bauhaus@bauhaus.de
        order_type:
          $ref: '#/components/schemas/OrderType'
        latest_pickup_date:
          type: string
          format: date-time
          example: '2024-09-01T18:00:00Z'
        pickup_date:
          type: string
          format: date-time
          example: '2024-09-01T06:00:00Z'
        invoice_address:
          oneOf:
            - $ref: '#/components/schemas/InvoiceAddress'
            - $ref: '#/components/schemas/UnpaidReservationInvoiceAddress'
        delivery_address:
          allOf:
            - $ref: '#/components/schemas/CustomerAddress'
            - type: object
              required:
                - street_name
                - street_number
                - postal_code
                - city
                - country
              properties:
                company:
                  type: string
                  example: Bahag
                additional_info:
                  type: string
                  example: info
        cart_id:
          type: string
          description: UUID of the cart
          example: 064af685-5612-47a3-a908-84de3e5e510a
        locker_pickup:
          type: boolean
          description: Identify if the order is selected to be placed in locker
          example: true
        currency:
          type: string
          description: ISO code for the currency
          example: EUR
        store_number:
          type: string
          description: Store number from where the order is placed
          example: 991
        employee_card_number:
          type: string
          description: Employee identification card number to used in discounts
          nullable: true
          example: 123456
        employee_number:
          type: string
          description: Employee identification number
          nullable: true
          example: 123456
        pluscard_number:
