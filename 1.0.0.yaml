paths:
  /health:
    get:
      summary: Get the api version, team and name
      operationId: getHealth
      tags:
        - health
      responses:
        200:
          $ref: '#/components/responses/Health'
        401:
          description: Unauthenticated
        403:
          description: Unauthorized
        500:
          $ref: '#/components/responses/Problem'
  /{country}/teasers:
    get:
      summary: Get already sorted teasers for a given country
      operationId: getTeasers
      tags:
        - teaser
      parameters:
        - $ref: '#/components/parameters/Country'
      responses:
        200:
          $ref: '#/components/responses/TeasersResponse'
        401:
          description: Unauthenticated
        403:
          description: Unauthorized
        500:
          $ref: '#/components/responses/Problem'
  /{country}/hero-banners:
    get:
      summary: Get the sorted hero banners for a given country
      operationId: getHeroBanners
      tags:
        - hero-banner
      parameters:
        - $ref: '#/components/parameters/Country'
      responses:
        200:
          $ref: '#/components/responses/HeroBannersResponse'
        401:
          description: Unauthenticated
        403:
          description: Unauthorized
        500:
          $ref: '#/components/responses/Problem'
  /{country}/suggestions:
    get:
      summary: Get suggestions for a search
      operationId: getSuggestions
      tags:
        - suggestion
      parameters:
        - $ref: '#/components/parameters/Country'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/LanguageId'
      responses:
        200:
          $ref: '#/components/responses/Suggestion'
        401:
          description: Unauthenticated
        403:
          description: Unauthorized
        500:
          $ref: '#/components/responses/Problem'
  /{country}/products/ean/{ean}:
    get:
      summary: Get product details
      operationId: getProductByEan
      tags:
        - product
      parameters:
        - $ref: '#/components/parameters/Country'
        - $ref: '#/components/parameters/Ean'
        - $ref: '#/components/parameters/LanguageId'
        - $ref: '#/components/parameters/StoreId_Q'
      responses:
        '200':
          $ref: '#/components/responses/Product'
        '401':
          description: Unauthenticated
        '403':
          description: Unauthorized
        '500':
          $ref: '#/components/responses/Problem'
  /{country}/products/{id}:
    get:
      summary: Get product details
      operationId: getProductById
      tags:
        - product
      parameters:
        - $ref: '#/components/parameters/Country'
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/LanguageId'
        - $ref: '#/components/parameters/StoreId_Q'
      responses:
        200:
          $ref: '#/components/responses/Product'
        401:
          description: Unauthenticated
        403:
          description: Unauthorized
        500:
          $ref: '#/components/responses/Problem'
  /{country}/product-availability/stores/{store_id}:
    get:
      summary: Get products information for online and offline stock and location
      operationId: getProductsByIds
      tags:
        - product
      parameters:
        - $ref: '#/components/parameters/Country'
        - $ref: '#/components/parameters/Products'
        - $ref: '#/components/parameters/StoreId_P'
        - $ref: '#/components/parameters/LanguageId'
