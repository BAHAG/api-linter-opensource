                          pattern: '^(?:\+49(?:15|16|17)\d{8}|\+43(?:650|660|664|676|677|680|681|688|699)\d{6}|\+33[67]\d{8}|\+386(?:30|31|40|41|51|64|65|68|69|70|71)\d{6}|\+3859\d{7,8}|\+316\d{8}|\+3526(?:21|28|51|55|58|61|68|71|78|81|91|92|98)\d{6}|\+34[67]\d{8}|\+393\d{9}|\+3519[1236]\d{7}|\+3069\d{8}|\+324\d{8}|\+3598[7-9]\d{6}|\+45\d{8}|\+372(?:5\d{6,7}|8[1-7]\d{6})|\+358(?:4[0-9]|50)\d{4,10}|\+3538[2-9]\d{7}|\+3712\d{7}|\+3706\d{7}|\+356[79]\d{7}|\+48(?:45|50|51|53|57|60|66|69|72|73|78|79|88)\d{7}|\+407\d{8}|\+467\d{7,9}|\+417[6-9]\d{7}|\+4219\d{8}|\+420[67]\d{8}|\+36(?:20|30|31|50|70)\d{7}|\+3579[4-9]\d{6}|\+47[49]\d{7}|\+354[678]\d{6}|\+423(?:7\d{6}|6[0-8]\d{7}))$'
