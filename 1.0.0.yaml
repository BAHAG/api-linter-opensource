      properties:
        amount:
          type: number
          format: float
        has_scale_shipping_costs:
          type: boolean
        product_id:
          type: string
        responsible_for_shipping_costs:
          type: boolean
        shippingcost_modifications:
          type: string

    ShippingCost:
      type: object
      properties:
        product_id:
          type: string
        shipping_costs:
          $ref: '#/components/schemas/SimplePrice'
