    Problem:
      type: object
      description: the common error base model which is always part the model returned in case of an expected error in an API
      required:
        - status_code
        - error_code
        - timestamp
        - ray_id
      properties:
        status_code:
          type: integer
          format: int32
          description: the http status code
          example: 400
        error_code:
          $ref: '#/components/schemas/ErrorCodeOC'
        timestamp:
          type: string
          format: date-time # UTC
          description: The format of the date-time value is in UTC
          example: '2025-03-05T12:12:12.000Z'
        ray_id:
          type: string
          description: A Cloudflare Ray ID is an identifier given to every request that goes through Cloudflare. You can the value in the header field "CF-Ray" of the incoming request. Ray IDs are particularly useful when evaluating Security Events for patterns or false positives or more generally understanding your application traffic. See also https://developers.cloudflare.com/fundamentals/reference/cloudflare-ray-id/
          example: '8b7ad55fc97a3a52-FRA'
        path:
          type: string
          example: '/path/to/resources'
          description: optional, should contain the path used in the incoming request
        detail:
          type: array
          description: >
            A human readable explanation specific to this occurrence of the
            problem that is helpful to locate the problem and give advice on how
            to proceed. Written in English and readable for engineers, usually not
            suited for non technical stakeholders and not localized.
          items:
            type: object
            description: the error detail item which is optional and can be used in the error model
            properties:
              ref:
                type: string
                description: a reference to which the error message belongs. As an example it could be a field in a form
                example: 'field_name'
              cause:
                type: string
                description: the detailed error message for the given reference defined under 'ref'
                example: 'max lenght is 10'
      example:
        status_code: 400
        timestamp: '2025-03-05T12:12:12.000Z'
        path: '/path/to/resources'
        ray_id: '8b7ad55fc97a3a52-FRA'
        error_code: 'OC_ORDER_SAVING_DB_FAILED'
        details:
          - ref: 'field_name'
          - cause: 'max lenght is 10'
    ErrorCodeOC:
      type: string
      description: >
        Possible error codes that the SalesService can return in case of a handled error.
      enum:
        - OC_ORDER_SAVING_DB_FAILED
        - OC_PAYLINK_ORDER_CREATION_FAILED
        - OC_GET_CASHIER_DESK_ORDERS_FAILED
        - OC_EMAIL_IS_REQUIRED
        - OC_EMAIL_NOT_FOUND
        - OC_UNAUTHORIZED
        - OC_UNKNOWN_ERROR
