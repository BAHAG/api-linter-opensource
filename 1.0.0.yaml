  schemas:
    Teasers:
      type: array
      description: A list of teasers
      items:
        allOf:
          - $ref: '#/components/schemas/Link'
          - type: object
            description: A single teaser object
            required:
              - title
              - text_link_value
              - text_link_label
            properties:
              title:
                type: string
                example: Special Offer
              text_link_value:
                type: string
                deprecated: true
                description: Deprecated - use href instead
                example: https://www.example.com/special-offer
              text_link_label:
                type: string
                deprecated: true
                description: Deprecated - use href_label instead
                example: Shop Now
    HeroBanners:
      type: array
      description: A list of hero banners
      items:
        $ref: '#/components/schemas/HeroBanner'
    HeroBanner:
      type: object
      description: A single hero banner
      required:
        - type
        - href
        - asset_id
        - value
        - position
      properties:
        type:
          type: string
          enum:
            - CAMPAIGN
            - LINK_INTERNAL
            - LINK_EXTERNAL
          example: CAMPAIGN
        href:
          type: string
          example: Campaign
        asset_id:
          type: string
          example: 12345
        value:
          type: string
          deprecated: true
          description: Deprecated - use href instead
          example: Campaign
        position:
          type: integer
          format: int32
          deprecated: true
          description: Deprecated - list is sorted by the backend
          example: 1
    IdName:
      type: object
      description: Object with only id and name property that can be reused in other schemas
      required:
        - id
      properties:
        id:
          type: string
          nullable: false
        name:
          type: string
          nullable: true
    CustomerNewAddress:
      type: object
      description: A new customer address
      required:
        - address_type
        - device_id
        - first_name
        - last_name
        - postal_code
        - town
        - street_name
        - house_number
        - country
        - default_address
      properties:
        address_type:
          $ref: '#/components/schemas/AddressType'
        device_id:
          type: string
          example: sales_app
        first_name:
          type: string
          example: John
        last_name:
          type: string
          example: Doe
        postal_code:
          type: string
          example: 12345
        town:
          type: string
          example: Mannheim
        street_name:
          type: string
          example: Musterstraße
        house_number:
          type: string
          example: 1
        country:
          type: object
          required:
            - isocode
            - name
          properties:
            isocode:
              type: string
              example: DE
            name:
              type: string
              example: Germany
        additional_info:
          type: string
          example: 1. Stock
        default_address:
          type: boolean
          example: false
    OrderType:
      type: string
      description: Enum represent what type this order is
      enum:
        - ORDER_IN_STORE
        - SHIP_TO_STORE
        - UNPAID_RESERVATION
        - PAID_RESERVATION
      example: ORDER_IN_STORE
    Store:
      type: object
      description: Information of a store
      required:
        - id
      properties:
        id:
          type: string
          example: 601
        display_name:
          type: string
          example: Mannheim-Mallau
        address:
          $ref: '#/components/schemas/StoreAddress'
        opening_hours:
          $ref: '#/components/schemas/OpeningHours'
        opening_hours_formatted:
          type: string
          description: Opening Hours as formatted String
          example: Mo-Sa 07:00-20:00
    OrdersList:
      type: object
      description: A list of orders
      required:
        - orders
        - total
      properties:
        total:
          type: integer
          format: int32
          example: 5
        orders:
          type: array
          items:
            type: object
            required:
              - offer_id
              - reference_number
              - created_at
              - billing_first_name
              - billing_last_name
              - order_type
              - status
              - total_price
              - currency
            properties:
              offer_id:
                type: string
                example: 12345678
              reference_number:
                type: string
                example: 12345678
              created_at:
                type: string
                format: date-time
                example: 2024-01-20T08:30:00
              billing_first_name:
                type: string
                example: Max
              billing_last_name:
                type: string
                example: Mustermann
              om_order_number:
                type: string
                example: 12345678
              total_price:
                type: string
                example: 45.90
              manual_discount:
                type: string
                example: 105.00
              currency:
                type: string
                format: iso-4217
                example: EUR
              order_type:
                $ref: '#/components/schemas/OrderType'
              status:
