          example: 2
        total_price:
          $ref: '#/components/schemas/SimplePrice'
        subtotal_price:
          $ref: '#/components/schemas/SimplePrice'
        base_price:
          $ref: '#/components/schemas/SimplePrice'
        effective_base_price:
          $ref: '#/components/schemas/SimplePrice'
        max_stock:
          type: integer
          format: int32
          description: Maximum stock of the product
          example: 10
