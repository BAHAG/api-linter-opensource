        - data
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              recommendations:
                type: array
                items:
                  $ref: '#/components/schemas/ProductCard'
    Product:
      type: object
      properties:
        product_number:
          type: string
        description:
          type: string
        pictures:
          type: array
          items:
            type: string
        title:
          type: string
        prices:
          $ref: '#/components/schemas/Prices'
        shipping_costs:
          $ref: '#/components/schemas/ShippingCost'
        online_stock:
          $ref: '#/components/schemas/Stock'
        offline_stock:
          $ref: '#/components/schemas/Stock'
        ean:
          type: string
        attributes:
          type: string
        quantity_restrictions:
          $ref: '#/components/schemas/QuantityRestrictions'
        display_quantity_calculator:
          type: boolean
        is_online_reservation_enabled:
          type: boolean
          example: false
        is_online_purchasability_enabled:
          type: boolean
          example: false
        self_service_ban:
          type: boolean
          example: false
        tax_class:
          type: string
          example: '1'
        net_content:
          type: object
          required:
            - value
            - unit
          properties:
            value:
              type: number
              format: float
            unit:
              $ref: '#/components/schemas/Unit'
        sell_quantity_unit:
          $ref: '#/components/schemas/SellQuantityUnit'
        usps:
          description: USPs are the unique selling points of a product
          type: array
          items:
            type: string
        ship_to_store:
          description: If the article is qualified for ship to store
          type: boolean
          example: true
        set_items:
          description: List of articles related to a set article
          type: array
          items:
            type: object
            properties:
              product_id:
                type: string
                example: 123456789
              quantity:
                type: integer
                format: int32
                example: 1
        seller_id:
          description: List of sellers for the product
          type: array
          items:
            type: string
        seller_info:
          $ref: '#/components/schemas/SellerInfo'
        features:
          description: Product features
          type: array
          items:
            type: object
            required:
              - name
              - type
              - range_attribute
            properties:
              name:
                type: string
                example: Spannweite Bohrfutter
              type:
                $ref: '#/components/schemas/ProductFeatureType'
              range_attribute:
                description:
                  True - only ranged_values are available
                  False - only values are available
                type: boolean
                example: true
              range_values:
                type: array
                items:
                  type: object
                  required:
                    - start_value
                  properties:
                    start_value:
                      $ref: '#/components/schemas/ProductFeatureValue'
                    end_value:
                      $ref: '#/components/schemas/ProductFeatureValue'
              values:
                type: array
                items:
                  $ref: '#/components/schemas/ProductFeatureValue'
        rating:
          type: object
          required:
            - average_rating
            - count
          properties:
            average_rating:
              type: number
              format: float
              example: 4.5
              description: average rating of the Product from collection_source all
            count:
              type: integer
              format: int32
              example: 88
              description: total amount of reviews of the Product from collection_source all
        datasheets:
          description: List of datasheet related to a products
          type: array
          items:
            type: object
            required:
              - name
              - url
            properties:
              name:
                type: string
                example: Bedienungsanleitung
              url:
                type: string
                example: www.google.com
        base_price_configuration:
          description: Base price configuration settings for product
          type: object
          properties:
            display:
              type: string
              enum:
                - STANDARD_DISPLAY
                - REVERSE_DISPLAY
                - NO_DISPLAY
        morphological_data:
          nullable: true
          description: Measurements of the Product
          required:
            - dimensions
            - net_weight
            - gross_weight
          type: object
          properties:
            dimensions:
              $ref: '#/components/schemas/MorphologicalDataDimensions'
            net_weight:
              $ref: '#/components/schemas/MorphologicalDataWeight'
            gross_weight:
              $ref: '#/components/schemas/MorphologicalDataWeight'
        variants:
          description: List of all variants for the product
          type: array
          items:
            type: object
            properties:
              category:
                description: category of the variants
                type: string
                example: Farbe
              products:
                type: array
                items:
                  $ref: '#/components/schemas/ProductVariant'
            required:
              - category
              - products
        scope_of_services:
          type: string
          example: '2 * Garantie'
        employee_discount_disabled:
          type: boolean
          example: false
          description: A boolean to indicate if a product is eligible for ANY discount or not (SalesApp Context)
        offers:
          nullable: true
          description: List of offers related to the product
          type: array
          items:
            type: object
            properties:
              seller_id:
                type: string
                nullable: true
                example: BAUHAUSDE
              online_purchasability:
                $ref: '#/components/schemas/Validity'
              quantity_restrictions:
                type: object
                description: Quantity restrictions for the offer
                properties:
                  online_order:
                    $ref: '#/components/schemas/Quantities'
              handling_code:
                $ref: '#/components/schemas/HandlingCode'
        elektrog_product_category:
          type: string
          example: 04
          nullable: true
        primary_category:
          type: string
          example: '10004460'
          nullable: true
        configuration_settings_class:
          type: string
          enum: [ '1', '2', '3' ]
          description: Item configuration settings class to indicate product type as defined in PIM
      required:
        - pictures
        - product_number
        - title
        - prices
        - shipping_costs
        - online_stock
        - offline_stock
        - description
        - ean
        - attributes
        - display_quantity_calculator
        - is_online_reservation_enabled
        - is_online_purchasability_enabled
        - sell_quantity_unit
        - usps
        - ship_to_store
        - set_items
        - features
        - datasheets
        - morphological_data
        - variants
        - scope_of_services
        - self_service_ban
        - employee_discount_disabled
        - seller_info
        - elektrog_product_category
    ProductFeatureValue:
      type: object
