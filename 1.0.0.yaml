components:
    schemas:
        ApprovalCustomerDto:
            required:
                - token
                - email
                - device_id
            type: object
            properties:
                token:
                    type: string
                email:
                    type: string
                    description: this is the email-address of the customer
                    pattern: /^(?!.{56})(?![.-])([A-Za-z0-9_%+-]+\.)*[A-Za-z0-9_%+-]+(?<![.-])@(?![.-])([A-Za-z0-9-]+\.)+[A-Za-z]{2,}$/
                device_id:
                    type: string
                guid:
                    type: string

        ResendCustomerDto:
            required:
                - token
                - email
            type: object
            properties:
                token:
                    type: string
                email:
                    type: string
                    description: this is the email-address of the customer
                    pattern: /^(?!.{56})(?![.-])([A-Za-z0-9_%+-]+\.)*[A-Za-z0-9_%+-]+(?<![.-])@(?![.-])([A-Za-z0-9-]+\.)+[A-Za-z]{2,}$/

        PluscardResendCustomerDto:
            required:
                - email
            type: object
            properties:
                email:
                    type: string
                    description: this is the email-address of the customer
                    pattern: /^(?!.{56})(?![.-])([A-Za-z0-9_%+-]+\.)*[A-Za-z0-9_%+-]+(?<![.-])@(?![.-])([A-Za-z0-9-]+\.)+[A-Za-z]{2,}$/

        DefaultCustomerDto:
            type: object
            required:
                - customer_registration_type
                - device_id
            properties:
                customer_registration_type:
                    $ref: 'https://api.swaggerhub.com/domains/BAHAG/api-customer-domain/3.0.15#/components/schemas/CustomerRegistrationType'
                device_id:
                    type: string
            discriminator:
                propertyName: customer_registration_type
                mapping:
                    NORMAL: RegisteredCustomerDto
                    NORMAL_BILLING: BillingCustomerDto
                    CHECKOUT_NORMAL: CheckoutBillingCustomerDto
                    CHECKOUT_SHIPPING: CheckoutShippingCustomerDto
                    CHECKOUT_PACKSTATION: CheckoutPackstationCustomerDto
                    CHECKOUT_STORE: CheckoutStoreCustomerDto
                    SERVICES_NORMAL: ServiceCustomerDto
                    SERVICES_GUEST: ServiceGuestCustomerDto
                    GUEST: GuestCustomerDto
                    FOREIGN: ForeignCustomerDto
                    PLUSCARD: PluscardCustomerDto

        BaseCustomerDto:
            allOf:
                - $ref: '#/components/schemas/DefaultCustomerDto'
                - required:
                      - tos_accepted
                      - first_name
                      - last_name
                      - email
                      - newsletter_accepted
                  type: object
                  properties:
                      first_name:
                          maxLength: 34
                          type: string
                      last_name:
                          minLength: 2
                          maxLength: 35
                          type: string
                      email:
                          type: string
                          description: this is the email-address of the customer
                          pattern: /^(?!.{56})(?![.-])([A-Za-z0-9_%+-]+\.)*[A-Za-z0-9_%+-]+(?<![.-])@(?![.-])([A-Za-z0-9-]+\.)+[A-Za-z]{2,}$/
                      tos_accepted:
                          type: boolean
                      newsletter_accepted:
                          type: boolean
                      correspondence_language:
                          description: |
                              This property is required if the given country_code equals CH
                          $ref: '#/components/schemas/CorrespondenceLanguage'
                      customer_tax_number:
                          type: string
                      guid:
                          type: string

        GuestCustomerDto:
            allOf:
                - $ref: '#/components/schemas/BaseCustomerDto'
                - type: object
                  required:
                      - cart_id
                  properties:
                      same_as_billing:
                          type: boolean
                          default: true
                      billing_address:
                          $ref: '#/components/schemas/BillingAddressDto'
                      shipping_address:
                          $ref: '#/components/schemas/ShippingAddressDto'
                      packstation_address:
                          $ref: '#/components/schemas/PackstationAddressDto'
                      store_address:
                          $ref: '#/components/schemas/StoreAddressDto'
                      phone:
                          type: string
                          pattern: '^[0+][0-9\s\-()./]+$'
                      cart_id:
                          type: string
                      employee_card_number:
                          type: string
                      is_reservation:
                          type: boolean
                          default: false
            example:
                device_id: 11
                customer_registration_type: GUEST
                first_name: John
                last_name: Doe
                email: johntest@testing.com
                billing_address:
                    house_number: 12a
                    phone: +49 123 4567890
                    first_name: Max
                    last_name: Mustermann
                    street_name: Musterstraße
                    postal_code: 12345
                    town: Berlin
                    country:
                        isocode: DE,
                        name: Deutschland
                    default_address: false
                    address_type: BILLING
                shipping_address:
                    house_number: 12a,
                    phone: +49 123 4567890
                    first_name: Max,
                    last_name: Mustermann,
                    street_name: Musterstraße
                    postal_code: 12345
                    town: Berlin
                    country:
                        isocode: DE
                        name: Deutschland
                    default_address: false
                    address_type: SHIPPING
                same_as_billing: false
                cart_id: 2132
                tos_accepted: true
                newsletter_accepted: false

        RegisteredCustomerDto:
            allOf:
                - $ref: '#/components/schemas/BaseCustomerDto'
                - type: object
                  required:
                      - password
                  properties:
                      password:
                          maxLength: 100
                          minLength: 8
                          type: string
                          x-constraints: '@PasswordFormat'

        ForeignCustomerDto:
            allOf:
                - $ref: '#/components/schemas/BaseCustomerDto'
                - type: object
                  required:
                      - token
                  properties:
                      token:
                          type: string
                      billing_address:
                          $ref: '#/components/schemas/BillingAddressDto'
                          description: |
                              This property is required if the given country_code equals ES

        ServiceCustomerDto:
            allOf:
                - $ref: '#/components/schemas/RegisteredCustomerDto'
                - type: object
                  required:
                      - phone
                  properties:
                      phone:
                          type: string
                          pattern: '^[0+][0-9\s\-()./]+$'

        ServiceGuestCustomerDto:
            allOf:
                - $ref: '#/components/schemas/BaseCustomerDto'
                - type: object
                  required:
                      - phone
                  properties:
                      phone:
                          type: string
                          pattern: '^[0+][0-9\s\-()./]+$'

        BillingCustomerDto:
            description: |
                This DTO is used for normal customer registration in ES
            allOf:
                - $ref: '#/components/schemas/RegisteredCustomerDto'
                - type: object
                  required:
                      - billing_address
                  properties:
                      same_as_billing:
                          type: boolean
                          default: true
                      billing_address:
                          $ref: '#/components/schemas/BillingAddressDto'

        CheckoutBillingCustomerDto:
            allOf:
                - $ref: '#/components/schemas/BillingCustomerDto'
                - type: object
                  required:
                      - cart_id
                  properties:
                      cart_id:
                          type: string

        CheckoutShippingCustomerDto:
            allOf:
                - $ref: '#/components/schemas/CheckoutBillingCustomerDto'
                - type: object
                  required:
                      - shipping_address
                  properties:
                      shipping_address:
                          $ref: '#/components/schemas/ShippingAddressDto'

        CheckoutPackstationCustomerDto:
            allOf:
                - $ref: '#/components/schemas/CheckoutBillingCustomerDto'
                - type: object
                  required:
                      - packstation_address
                  properties:
                      packstation_address:
                          $ref: '#/components/schemas/PackstationAddressDto'

        CheckoutStoreCustomerDto:
            allOf:
                - $ref: '#/components/schemas/CheckoutBillingCustomerDto'
                - type: object
                  required:
                      - store_address
                  properties:
                      store_address:
                          $ref: '#/components/schemas/StoreAddressDto'

        SocialCustomerDto:
            allOf:
                - $ref: '#/components/schemas/BaseCustomerDto'
                - type: object
                  required:
                      - id_token
                      - provider
                  properties:
                      id_token:
                          type: string
                      provider:
                          $ref: '#/components/schemas/SocialProvider'

        SocialProvider:
            type: string
            enum:
                - APPLE
                - GOOGLE

        CorrespondenceLanguage:
            type: string
            enum:
                - de-DE
                - de-CH
                - it-CH
                - fr-CH
            example: de-CH

        NewsletterType:
            type: string
            enum:
                - LEGACY
                - PERSONALISATION
            default: LEGACY
            example: PERSONALISATION

        PluscardCustomerDto:
            allOf:
                - $ref: '#/components/schemas/DefaultCustomerDto'
                - type: object
                  required:
                      - pluscard_number
                      - contract_number
                      - email
                      - password
                      - tos_accepted
                      - newsletter_accepted
                  properties:
                      pluscard_number:
                          type: string
                      contract_number:
                          type: string
                      password:
                          maxLength: 100
                          minLength: 8
                          type: string
                          x-constraints: '@PasswordFormat'
                      email:
                          type: string
                          description: this is the email-address of the customer
                          pattern: /^(?!.{56})(?![.-])([A-Za-z0-9_%+-]+\.)*[A-Za-z0-9_%+-]+(?<![.-])@(?![.-])([A-Za-z0-9-]+\.)+[A-Za-z]{2,}$/
                      tos_accepted:
                          type: boolean
                      newsletter_accepted:
                          type: boolean
                      first_name:
                          type: string
                          description: |
                              This property is required if the given country_code equals CH
                      last_name:
                          type: string
                          minLength: 2
                          maxLength: 35
                          description: |
                              This property is required if the given country_code equals CH
                      correspondence_language:
                          description: |
                              This property is required if the given country_code equals CH
                          $ref: '#/components/schemas/CorrespondenceLanguage'
                      billing_address:
                          $ref: '#/components/schemas/BillingAddressDto'
                          description: |
                              This property is required if the given country_code equals ES
                      guid:
                          type: string
                      phone:
                          type: string
                          pattern: '^[0+][0-9\s\-()./]+$'
                          description: |
                              This property is required if the given country_code equals CH

        PluscardRequestDto:
            type: object
            required:
                - email
                - tos_accepted
                - newsletter_accepted
            properties:
                email:
                    type: string
                    description: this is the email-address of the request-account
                    pattern: /^(?!.{56})(?![.-])([A-Za-z0-9_%+-]+\.)*[A-Za-z0-9_%+-]+(?<![.-])@(?![.-])([A-Za-z0-9-]+\.)+[A-Za-z]{2,}$/
                password:
                    maxLength: 100
                    minLength: 8
                    type: string
                    x-constraints: '@PasswordFormat'
                tos_accepted:
                    type: boolean
                newsletter_accepted:
                    type: boolean
                guid:
                    type: string
                purchase_on_account:
                    $ref: '#/components/schemas/PluscardRequestPurchaseOnAccountDataDto'
                company_data:
                    $ref: '#/components/schemas/PluscardRequestCompanyDataDto'
                main_card_holder:
                    $ref: '#/components/schemas/PluscardRequestCardHolderDataDto'
                main_card:
                    $ref: '#/components/schemas/PluscardRequestMainCardDataDto'
                bank_data:
                    $ref: '#/components/schemas/PluscardRequestBankDataDto'

        PluscardRequestPurchaseOnAccountDataDto:
            type: object
            required:
                - contract_type
            properties:
                contract_type:
                    $ref: '#/components/schemas/PluscardContractType'
                credit_limit:
                    $ref: '#/components/schemas/PluscardCreditLimit'
                settlement_mode:
                    $ref: '#/components/schemas/PluscardSettlementMode'

        PluscardContractType:
            type: string
            enum:
                - PURCHASE_ON_ACCOUNT
                - BONUS
            example: BONUS
            default: BONUS

        PluscardCreditLimit:
            type: string
            enum:
                - THOUSAND
                - TWO_THOUSAND_FIVE_HUNDRED
                - FIVE_THOUSAND
                - TEN_THOUSAND
                - TWENTY_THOUSAND
            example: THOUSAND
            default: THOUSAND

        PluscardSettlementMode:
            type: string
            enum:
                - COLLECTIVE_INVOICE
                - INDIVIDUAL_INVOICE
            example: INDIVIDUAL_INVOICE
            default: INDIVIDUAL_INVOICE

        PluscardRequestCompanyDataDto:
            type: object
            required:
                - legalform
            properties:
                legalform:
                    $ref: '#/components/schemas/PluscardLegalform'
                legalform_misc:
                    type: string
                    maxLength: 50
                company_register_number:
                    type: string
                    maxLength: 50
                files:
                    type: array
                    items:
                        $ref: '#/components/schemas/FileDto'
                company_data:
                    $ref: '#/components/schemas/CompanyDataDto'
                deviating_company_data:
                    $ref: '#/components/schemas/CompanyDataDto'
                number_of_employees:
                    $ref: '#/components/schemas/EmployeeCount'
