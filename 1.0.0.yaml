              type: string
              example: Millimeter
            symbol:
              type: string
              example: mm
        asset_ids:
          type: array
          items:
            type: string
            example: 12345678
    ProductFeatureType:
      type: string
      enum:
        - ENUM
        - DATE
        - REFERENCE
        - STRING
        - NUMBER
        - BOOLEAN
      example: NUMBER
    ProductCard:
      type: object
      properties:
        product_id:
          type: string
          deprecated: true
          description: Legacy alias for product_number kept for backward compatibility
        product_number:
          type: string
        description:
          type: string
        picture:
          type: string
        title:
          type: string
        seller_info:
          $ref: '#/components/schemas/SellerInfo'
        sell_quantity_unit:
          $ref: '#/components/schemas/SellQuantityUnit'
        prices:
          $ref: '#/components/schemas/Prices'
        online_stock:
          $ref: '#/components/schemas/Stock'
        offline_stock:
          $ref: '#/components/schemas/Stock'
        ship_to_store:
          description: If the article is qualified for ship to store
          type: boolean
          example: true
        set_items:
          description: List of articles related to a set article
          type: array
          items:
            type: object
            properties:
              product_id:
                type: string
                example: 123456789
              quantity:
                type: integer
                format: int32
                example: 1
        variants:
          description: number of available variants for the product
          type: integer
          format: int32
