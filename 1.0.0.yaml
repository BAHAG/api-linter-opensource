          example: Doe
          maxLength: 35
          minLength: 2
        street_name:
          type: string
          example: Gutenbergstraße
          maxLength: 35
          minLength: 2
        street_number:
          type: string
          example: 21
          minLength: 1
          maxLength: 10
        postal_code:
          type: string
          example: 12345
        city:
          type: string
          example: Mannheim
          minLength: 2
          maxLength: 35
        country:
          type: string
          example: DE
        phone:
          type: string
          example: 123456789
        mobile_phone:
          type: string
          example: 123456789
