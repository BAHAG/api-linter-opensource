            - HIGH
          example: LOW
        link_url:
          type: string
          example: https://www.example.com/special-offer
        link_text:
          type: string
          example: Shop Now
    Links:
      type: array
      description: Links to be shown in the profile drawer of the SalesApp
      items:
        $ref: '#/components/schemas/Link'
    Link:
      type: object
      description: A single link item
      required:
        - href_label
        - href
        - type
        - icon
      properties:
        href_label:
          type: string
          example: Ihre Meinung zählt!
        href:
          type: string
          example: https://www.example.com/feedback
        type:
          type: string
          enum:
            - CAMPAIGN
            - LINK_INTERNAL
            - LINK_EXTERNAL
          example: LINK_INTERNAL
        icon:
          type: string
          example: icon
    AddressValidation:
      type: object
      required:
        - type
        - combinations
      properties:
        type:
          type: string
          enum:
            - EXACT_MATCH
            - SUGGESTION
          description: >
            "EXACT_MATCH" — the zip/city input matched exactly
            "SUGGESTION" — no exact match found
        combinations:
          type: array
          items:
            type: object
            required:
              - postal_code
              - city
            properties:
              postal_code:
                type: string
                description: Zip code for the address
                example: 10000
              city:
                type: string
                description: city for the address
                example: ZAGREB
    LockerAvailableRequest:
      type: object
      required:
        - products
      properties:
        products:
          type: array
          description: List of products
          items:
            type: object
            required:
              - product_number
            properties:
              product_number:
                type: string
                description: Product number
                example: "123456789"
              quantity:
                type: integer
                format: int32
                description: Quantity of the article
                example: 2
    LockerAvailableResponse:
      type: object
      required:
        - locker_available
      properties:
        locker_available:
          type: boolean
          description: Indicates whether the cart fits in a locker or not
          example: true